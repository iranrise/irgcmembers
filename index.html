<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Directory Wall</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">📌</div>
      <div>
        <div class="title">Directory Wall</div>
        <div class="subtitle">Auth-only directory (consent-based)</div>
      </div>
    </div>

    <div class="controls">
      <input id="searchInput" class="search" placeholder="Search name, title, from…" />
      <button id="refreshBtn" class="btn">Refresh</button>
      <button id="openFormBtn" class="btn primary">Add entry</button>
      <button id="authBtn" class="btn">Sign in</button>
      <button id="signOutBtn" class="btn hidden">Sign out</button>
    </div>
  </header>

  <main class="layout">
    <section class="wall">
      <div class="wallHeader">
        <div class="hint">Items scroll continuously. Higher score appears bolder.</div>
        <div id="statusText" class="statusText">Not signed in.</div>
      </div>

      <div id="columns" class="columns">
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
        <div class="col"></div>
      </div>
    </section>

    <aside class="panel">
      <div class="panelCard">
        <h2>Notes</h2>
        <ul>
          <li>This directory is for consenting entries.</li>
          <li>Sign in required to view/add/vote.</li>
          <li>Images are stored in Supabase Storage.</li>
        </ul>
      </div>
    </aside>
  </main>

  <!-- Add Entry Modal -->
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modalBackdrop" id="modalBackdrop"></div>
    <div class="modalCard" role="dialog" aria-modal="true">
      <div class="modalHead">
        <h2>Add directory entry</h2>
        <button id="closeModalBtn" class="iconBtn" aria-label="Close">✕</button>
      </div>

      <form id="entryForm" class="form">
        <label>
          Full name (consent-based)
          <input id="fullName" type="text" required placeholder="Full Name" />
        </label>

        <label>
          Title
          <select id="title" required>
            <option value="">Select…</option>
            <option>Member</option>
            <option>Volunteer</option>
            <option>Coordinator</option>
            <option>Leader</option>
            <option>Other</option>
          </select>
        </label>

        <label>
          From (optional)
          <input id="fromLabel" type="text" placeholder="City / Department / Group" />
        </label>

        <label>
          Social media / website (optional)
          <input id="socialUrl" type="url" placeholder="https://…" />
        </label>

        <label>
          Upload image (optional)
          <input id="imageFile" type="file" accept="image/*" />
        </label>

        <label>
          Description (optional, max 280)
          <textarea id="description" rows="4" maxlength="280" placeholder="Short description…"></textarea>
        </label>

        <div class="formActions">
          <button type="button" id="cancelBtn" class="btn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>

        <div id="formMsg" class="formMsg"></div>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal hidden" aria-hidden="true">
    <div class="modalBackdrop" id="authBackdrop"></div>
    <div class="modalCard" role="dialog" aria-modal="true">
      <div class="modalHead">
        <h2>Sign in</h2>
        <button id="closeAuthBtn" class="iconBtn" aria-label="Close">✕</button>
      </div>
      <div class="form">
        <label>
          Email
          <input id="email" type="email" placeholder="you@example.com" />
        </label>
        <button id="magicLinkBtn" class="btn primary">Send magic link</button>
        <div id="authMsg" class="formMsg"></div>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
